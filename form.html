<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <heaader>
        <a href="index.html">Go to Index Page</a>
    </heaader>
    <main>
        <section>
            <h1>Sign In</h1>
            <p>Enter your email address and password to securely log in to AltSchool Student Portal</p>
        </section>
        <form role="group">
            <div>
                <label for="email">Email</label>
                <div>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" autofocus>
                </div>
            </div>
            <br>
            <div>
                <label for="password">Password</label>
                <div>
                    <input type="password" id="password" name="password" placeholder="*******">
                </div>
            </div>
            <br>
            <div>
                <button>Proceed to Dashboard</button>
                <p>Forgot your password? <a href="">Reset Now!</a></p>
                <p>OR</p>
                <button>Login with Google</button>
            </div>
        </form>

    </main>
    <script src="./script.js"></script>
</body>

</html>
